name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main # Falls dein Haupt-Branch "master" heißt, passe dies hier an

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Quellcode auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java-Umgebung einrichten
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Flutter SDK installieren
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Abhängigkeiten (Pakete) laden
      - name: Install Dependencies
        run: flutter pub get

      # 5. Flutter Web Build erstellen (inkl. passendem Base-Href für GitHub Pages)
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # 6. Build auf den gh-pages Branch hochladen
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
