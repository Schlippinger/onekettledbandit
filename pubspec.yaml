name: kettlebell_app
description: "A new Kettlebell workout application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Hier die benötigten Pakete hinzufügen:
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Hier den Ordner für deine Übungsbilder freigeben:
  assets:
    - assets/bulgariansplitsquad.png
    - assets/clean.png
    - assets/deadbug.png
    - assets/einarmigesrudern.png
    - assets/floorpress.png
    - assets/gobletsquat.png
    - assets/highpull.png
    - assets/kettlebellsitup.png
    - assets/kettlebellswing.png
    - assets/overheadpress.png
    - assets/plankpullthrough.png
    - assets/plankrow.png
    - assets/pushpress.png
    - assets/quartergetup.png
    - assets/reverselunge.png
    - assets/romaniandeadlift.png
    - assets/russiantwist.png
    - assets/singlelegdeadlift.png
    - assets/staggeredrow.png
    - assets/suitcasecarry.png
    - assets/sumosquat.png
    - assets/turkishgetup.png
